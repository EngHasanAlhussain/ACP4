spring.application.name=acp4

# ?? Kafka ??????????????????????????????????????????????
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=acp4-log-consumer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ?? Redis ??????????????????????????????????????????????
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ?? RabbitMQ ???????????????????????????????????????????
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ?? Postgres ???????????????????????????????????????????
spring.datasource.url=jdbc:postgresql://localhost:5432/acp4
spring.datasource.username=acp4user
spring.datasource.password=acp4pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# ?? Claude API ?????????????????????????????????????????
claude.api.key=${CLAUDE_API_KEY}
claude.api.url=https://api.anthropic.com/v1/messages
claude.api.model=claude-opus-4-6

# ?? App config ?????????????????????????????????????????
# How many log lines to batch before sending to AI
app.log.batch-size=20
# Deduplication window in seconds (don't re-raise same error within this window)
app.dedup.ttl-seconds=1800

# RabbitMQ queue name
app.rabbitmq.queue=ticket-queue

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

github.token=${GITHUB_TOKEN}
github.owner=EngHasanAlhussain
github.repo=acp4-bank-services